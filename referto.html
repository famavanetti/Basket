 T.p.filter(function(p){return p.on}).forEach(function(p){var fs=L.filter(function(e){return e.t==k&&e.n===p.n&&e.fl}),c='';for(var i=0;i<5;i++)c+='<span class="fb">'+(fs[i]?sg(fs[i]):'')+'</span>';h+='<tr><td>'+esc(p.lic)+'</td><td>'+esc(p.name)+(p.c?' (C)':'')+'</td><td>'+p.n+'</td><td>'+(p.s?'✕':'')+'</td><td>'+c+'</td><td>'+p.pts+'</td></tr>'});

>. Potete tenere squadre e roster (si azzerano punteggio, registro, falli, timeout e cronometro) oppure cancellare tutto. L’operazione non si può annullare, ma l’archivio dei referti già chiusi resta intatto.</li></ul><figure class=""><img alt="Anteprima del referto" src="data:image/webp;base64,UklGRtyqAABXRUJQVlA4INCqAADwpQKdASqEA8wCPm0ylUekIqchI9KM0OANiWlu/sT+Vdg/t89VwNAZgD0Avwf+Ta4VoFoA/gH8T9N+LR0t6gH8I1gH8A9G3fJ/RP8j6AP4p/bf2L4gDy5/wGyS7+vSxeuRhf/IN2N/3/6f/UH850hdS80Xqrnl+gUby5/6jvE99SHpL8wH7Uerz6IfQA/YD1b/Wb9AD9gPTc9nz9w/3O9rvVevgn8f/q/5K/2X5WfHv0/+g/3z9d/7H+0vuL+HfKf1z+u/sj/Zv/t/s/gu/hfOz6N/P/430L/j/13+4/1//Af8L/L/vl8D/1/8eP7f+4ntv+Vfr39a/M/+k/IF+Q/yD+wf1T/Ef9D+6/vf7jf9l/jf7B34uVf37/h/mZ8AvqV8f/v/9r/w3/Z/znnMfo39k/WP+3f///1fQ34t/Qf9B+Z/+I////4/QD+Lfy//Jf3T9v/7x////z9kf23/v/4HyRfpf+j/83+R+AL+Qf0D/I/4X/G/7H/J/////fif+tf6H+4/8f/7/7T////j4a/kn91/5f+Q/0X7b/YP/Jv53/s/7z/mf/z/qf///+vvX/8/ug/Z//8+5x+wH/y/bv//mF/9FZQzPQDMllci1X53m6NMBZXItV+d5ujTAWVyLVfnebo0wDpJdlTOtnvzEvyRR1BwYMyJY9RnAsqqrAhLru9JZQ4SLx1VY3bpOhSeobESyYHBlIpAO9nRaXnT/m7wWM5+FkVJrFRQrzHBPhLO4BaF07IBy8cmclfqr87zdGmAsBQWAM2+J03C29g1DVongAJYNBvyjhx2upJY+XHF+d5ujTAWVC9an2CwJDG7ljS4ns2S4OKEJwjD2R97LUhlIM2VlHGboYZBBgNPpc+Yn1Rp8yV+qvzvN0aYCyuS7GahmegGZLK5FqvzVyUGk3z2i7lqaRSGB5ztlfVGi4qcMDznbK+qaFxU4YHnO2V9U0LipwwPOdsr6poWJUJjIZ1ivtMWG5MWgkTkqk/J321X53m6NMBZXItV+d5ujTAWVyLVfnebo0wFlci1X53m4a4NAOtTFk0aXYYZGwq+KZAToAZrLDTI8jo83dggF/HYuZNWpqYq32C+eGq/O83RpgLK5FqvzvN0aYCyuRar87zdGh9SLb44hOuC5rVanlMYBP4MspusMgkT+uAaXYgcsDzO9tbMjeMgQtaC41gW0GA0A0fIxwtBOT4whIidx/oDWWcTBHaAXfwiigPYrwV1xar87zdGl10Ni8McuMh003HF+d5ujTAWVyLVfmrtPbAyDbJVdMrrshC6UAB6E+mDKozcsPlKYfgIm6G8e7rxGgjtosk5YiMYNUTsl50ht0r8Hb6XlY4zOnFrnYbwFLspHhyj6CGo0+brDysIVUma4eAb/yTcA1N5bzvISXA3B4UJtmapegmlZ9GSeD/QDNqT0tTNu/lontsQ6q+teYpcUGSdZJsntII0aPRJ1ROH/pYFVagr71J+akX/cHn08HbFOT7sswFs3ytER86RLi9CLYuvRhDnsQjrCnXqYk3Hnhh7BGsBbkM0nzPZC/O83H0C6qU5X1Hr0z+65ClJc4PBe860YfimcZMJAWZhsTQT5cI+nloSTSExGrJQx/Y5y99rozh5OBfzhS5wv/AfnXNQS+S2BcMSQ93nNRnBZnTK4bkInVwOAvHK7+7ZKnLx
