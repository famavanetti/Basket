<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Referto + Tiri</title><meta name="theme-color" content="#12183a">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#060b20;--bar:#12183a;--pan:#0d1330;--row:#1a2150;--ln:#2a3570;--tx:#fff;--mu:#8d96c8;--ok:#1fa35c;--no:#a32636;--gold:#ffd93a;--blue:#0b2a8a;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,sans-serif;font-size:14px;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:var(--row);border-radius:8px;cursor:pointer;font-weight:800}
button:disabled{opacity:.35;cursor:default}
input,select{font:inherit;color:inherit;background:var(--pan);border:1px solid var(--ln);border-radius:8px;min-height:44px;padding:0 10px;width:100%;-webkit-user-select:text;user-select:text}
label{display:block;color:var(--mu);font-size:12px;font-weight:700;margin:10px 0 4px}
#rbcloud{top:2px!important;bottom:auto!important;right:auto!important;left:64px!important;font-size:9px!important;opacity:.7}
.app{height:100dvh;display:flex;flex-direction:column}
/* barra */
.top{flex:none;height:58px;display:flex;align-items:center;justify-content:center;gap:14px;background:var(--bar);border-bottom:1px solid #1e2650;position:relative;padding:0 76px 0 56px}
.top.flr{animation:flr .5s ease-in-out 5}.top.flg{animation:flg .6s ease-in-out 2}
@keyframes flr{0%,100%{background:var(--bar)}50%{background:#e11d2b}}
@keyframes flg{0%,100%{background:var(--bar)}50%{background:#1fa35c}}
.menu{position:absolute;left:8px;top:7px;width:44px;height:44px;background:none;font-size:26px;color:var(--mu)}
.team{font-weight:900;font-size:15px;border:2px solid #2fd16a;background:#0a3b24;padding:4px 10px;border-radius:7px;max-width:22vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl3{display:flex;gap:3px}.fl3 i{width:11px;height:24px;border:2px solid #3a4378;border-radius:2px}.fl3 i.on{background:var(--gold);border-color:var(--gold)}.fl3.bn i.on{background:#ff5a5a;border-color:#ff5a5a}
.to{font-size:11px;color:var(--mu);font-weight:700;white-space:nowrap}.to b{background:#232b57;color:#fff;padding:3px 6px;border-radius:4px;margin-left:3px}
.sc{font-weight:900;font-size:30px;padding:0 10px;border-radius:5px;line-height:1.25}.y{background:var(--gold);color:#000}.bl{background:var(--blue)}
.q{font-size:13px;font-weight:800;color:#9aa3d8}
.clk{background:none;font-size:42px;font-weight:900;padding:0 4px;min-width:118px}
.opp{font-size:10px;color:var(--mu);font-weight:700;text-align:center;line-height:1.2;max-width:15vw;overflow:hidden}
.go{position:absolute;right:8px;top:8px;height:42px;background:var(--ok);padding:0 18px;font-size:13px}.go.st{background:var(--no)}
.tob{position:absolute;left:50%;transform:translateX(-50%);bottom:-22px;background:#e11d2b;color:#fff;font-weight:900;font-size:12px;padding:2px 14px;border-radius:0 0 8px 8px;z-index:6}
/* corpo */
.main{flex:1;min-height:0;display:grid;gap:8px;padding:8px;grid-template-columns:92px 60px minmax(0,1fr) 210px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"pl fl court ac" "pl fl log ac"}
.pl{grid-area:pl;display:flex;flex-direction:column;gap:6px;min-height:0}
.p{flex:1 1 0;min-height:0;min-width:0;background:var(--gold);color:#000;border-radius:8px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.p .n{font-size:34px;font-weight:900;line-height:1}.p small{font-size:11px;font-weight:800}.p em{font-style:normal;font-size:10px;font-weight:700;opacity:.65}
.p.sel{outline:4px solid #fff;outline-offset:-4px}
.bars{position:absolute;left:5px;top:8px;bottom:8px;width:6px;display:flex;flex-direction:column-reverse;gap:2px}.bars i{flex:1;background:rgba(0,0,0,.18)}.bars i.on{background:rgba(0,0,0,.75)}
.bench{flex:none;height:40px;background:var(--bar);color:#9aa3d8;font-size:11px}
.fl{grid-area:fl;display:flex;flex-direction:column;gap:6px;min-height:0}
.c{background:var(--row);border-radius:7px;font-weight:800;font-size:13px;min-height:38px;padding:4px;flex:none}.c.on{background:var(--gold);color:#000}
.fl hr{border:0;height:6px}.fs{margin-top:auto;font-size:10px;text-align:center;color:var(--mu);font-weight:700;line-height:1.3}.fs b{display:block;color:#fff;font-size:13px}
.court{grid-area:court;background:var(--pan);border-radius:12px;min-height:0;min-width:0;position:relative;overflow:hidden}
.court svg{position:absolute;inset:0;width:100%;height:100%}
.cap{position:absolute;left:12px;top:8px;font-size:11px;font-weight:800;color:var(--gold);z-index:2;pointer-events:none}
.log{grid-area:log;background:#000;border-radius:8px;font-size:12px;overflow:hidden;min-height:0}
.log div{display:flex;gap:10px;padding:6px 10px;border-left:3px solid var(--gold);border-bottom:1px solid #12183a;white-space:nowrap}
.log .t{margin-left:auto;color:var(--mu)}.okc{color:#2fd16a;font-weight:800}.kc{color:#ff5a5a;font-weight:800}
.ac{grid-area:ac;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:2fr 2fr .8fr 1fr 1fr 1fr .8fr;gap:6px;min-height:0}
.ac .b{background:var(--bar);border-bottom:3px solid #232b57;font-size:13px;min-height:0}
.ac .r1{background:var(--ok);border-color:#26c473;font-size:20px;grid-column:1/3}.ac .r0{background:var(--no);border-color:#d03a4c;font-size:20px;grid-column:1/3}
.g3{grid-column:1/-1;display:flex;gap:6px;min-height:0}.g3 .b{flex:1}.g3 .on{background:var(--blue);border-color:#3b63ff}
.ac .w{grid-column:span 1}.ac .qe{background:var(--blue);border-color:#3b63ff}
@media (orientation:portrait){
 .top{gap:8px;padding:0 70px 0 46px;height:62px}.opp{display:none}.team{max-width:90px;font-size:13px}.sc{font-size:26px}.clk{font-size:34px;min-width:100px}.menu{left:2px}.fl3 i{width:9px}
 .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 108px auto auto;grid-template-areas:"fl" "court" "pl" "ac" "log"}
 .fl{flex-direction:row;flex-wrap:wrap;align-items:center}.fl hr{width:8px;height:0}.fs{margin:0 0 0 auto;display:flex;gap:8px;align-items:center}.fs b{display:inline}
 .pl{flex-direction:row}.p .n{font-size:38px}.bench{display:none}
 .ac{grid-template-columns:repeat(4,1fr);grid-template-rows:84px 50px 50px 50px 50px}
 .ac .r1,.ac .r0{grid-column:span 2}.ac .w{grid-column:span 1}.ac .lu,.ac .qe{grid-column:span 2}
 .log{max-height:84px}
}
@media (max-width:1100px) and (orientation:landscape){.main{grid-template-columns:80px 54px minmax(0,1fr) 180px}.p .n{font-size:28px}.clk{font-size:36px}}
/* modali */
.mo{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:30;padding:10px}
.md{background:#141b3d;border-radius:14px;padding:16px;width:min(720px,100%);max-height:94dvh;overflow:auto;border:1px solid var(--ln)}
.md h3{font-size:18px;margin-bottom:4px}.hint{color:var(--mu);font-size:12px;line-height:1.45;margin-bottom:10px}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0}
.lp{background:#232b57;border-radius:8px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.lp .n{font-size:30px;font-weight:900;line-height:1}.lp small{font-size:10px;font-weight:700;color:#c6cdf0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp.on{background:var(--gold);color:#000}.lp.on small{color:#000}
.mr{display:flex;gap:8px;margin-top:10px}.mr button{flex:1;min-height:52px;font-size:15px}.mr .ok{background:var(--ok)}
.big{display:flex;gap:8px;margin:10px 0}.big button{flex:1;min-height:90px;font-size:20px}
.st{width:100%;border-collapse:collapse;font-size:13px}.st th,.st td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--ln)}.st td:first-child,.st th:first-child{text-align:left}.st tr[data-a]{cursor:pointer}.st tr[data-a]:active{background:#232b57}.st .c{min-height:32px;padding:2px 8px}.st .tt td{border-top:2px solid var(--ln)}
.mi{display:block;width:100%;text-align:left;padding:14px;margin-top:6px;min-height:50px;font-size:14px}
.card{background:var(--pan);border-radius:12px;padding:12px;margin-bottom:10px}
.wrap{max-width:760px;margin:0 auto;padding:14px;height:100dvh;overflow:auto;-webkit-user-select:text}
.wrap h1{font-size:20px;margin-bottom:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1;min-height:48px}
.gold{background:var(--gold)!important;color:#111}
#toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000e;border:1px solid var(--ln);padding:9px 16px;border-radius:20px;font-weight:700;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}#toast.on{opacity:1}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script src="app.js"></script><script src="firebase-config.js"></script><script src="sync.js"></script>
<script>
richiediLogin();
/* ================= dati =================
   Tiri e partite: STESSA chiave di tiri.html (rb_tiri_v1) -> la scheda "Mappa" di tiri.html vede subito questi tiri.
   Referto di squadra (log eventi, quintetto, cronometro): chiave propria rb_rt_v1. */
var KT='rb_tiri_v1',KR='rb_rt_v1';
function $(i){return document.getElementById(i)}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'')}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fd(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function toast(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=''},1800)}
function loadT(){try{var o=JSON.parse(localStorage.getItem(KT)||'null');if(o&&Array.isArray(o.games)&&Array.isArray(o.shots))return o}catch(e){}return{games:[],shots:[],cur:''}}
var D=loadT();
function mutD(fn){D=loadT();fn();try{localStorage.setItem(KT,JSON.stringify(D))}catch(e){toast('Memoria piena: esporta un backup dalla pagina Mappa dei tiri')}}
function defR(){return{g:'',q:1,clock:600,log:[],on:[],pk:'',over:0}}
function loadR(){try{var o=JSON.parse(localStorage.getItem(KR)||'null');if(o&&Array.isArray(o.log))return Object.assign(defR(),o)}catch(e){}return defR()}
var R=loadR();
function saveR(){try{localStorage.setItem(KR,JSON.stringify(R))}catch(e){}}
var U={running:false,c0:0,t0:0,pend:null,fp:'sel',fq:0,modal:null,live:null,toEnd:0,tm:null,lastSave:0};
function G(){return D.games.filter(function(g){return g.id===R.g})[0]||null}

/* ================= squadre e giocatori (come in tiri.html) ================= */
function teamLabel(x){return((x.squadra||'')+' '+(x.genere||'')).trim()}
function teams(){var m={};anagGet().forEach(function(x){if(x.tipo==='giocatore'&&teamLabel(x))m[teamLabel(x)]=1});return Object.keys(m).sort()}
function roster(sq){return anagGet().filter(function(x){return x.tipo==='giocatore'&&teamLabel(x)===sq}).map(function(x){return{pk:'g|'+norm(x.cognome)+'|'+norm(x.nome),n:String(x.numero==null?'':x.numero),nm:((x.cognome||'')+' '+(x.nome||'')).trim(),t:0}}).sort(byNum)}
function byNum(a,b){return(parseInt(a.n)||999)-(parseInt(b.n)||999)}
function ours(g){if(!g)return[];var r=(g.roster&&g.roster.length)?g.roster.filter(function(p){return!p.t}):roster(g.sq);return r.concat((g.extra||[]).filter(function(p){return!p.t}))}
function pinfo(pk){return ours(G()).filter(function(p){return p.pk===pk})[0]}
function mapPlayers(ps,t){var A=anagGet().filter(function(x){return x.tipo==='giocatore'});
 return ps.map(function(p){var k=norm(p.name),f=t===0&&A.filter(function(x){return norm((x.cognome||'')+(x.nome||''))===k||norm((x.nome||'')+(x.cognome||''))===k})[0];
  return{pk:f?'g|'+norm(f.cognome)+'|'+norm(f.nome):(t===0?'r|':'o|')+norm(p.name)+'|'+norm(p.n),n:String(p.n),nm:p.name,t:t}}).sort(byNum)}
function liveDoc(gid){return(U.live||[]).filter(function(x){return x.gid===gid})[0]}
function newGameFromLive(gid,i){var x=liveDoc(gid);if(!x)return;var ex=D.games.filter(function(g){return g.gid===gid})[0];
 if(!ex){var t=x.teams||[],me=t[i]||{},op=t[1-i]||{};
  ex={id:uid('g'),gid:gid,mi:i,sq:me.name||'Squadra',av:op.name||'',d:(x.d||'').slice(0,10)||today(),extra:[],roster:mapPlayers(me.p||[],0).concat(mapPlayers(op.p||[],1))};
  mutD(function(){D.games.push(ex);D.cur=ex.id})}
 startGame(ex.id)}
function startGame(id){R=defR();R.g=id;U.pend=null;U.running=false;saveR();render()}

/* ================= regole (FIBA) ================= */
function per(q){return q<=2?1:q<=4?2:q}
function toMax(q){return q<=2?2:q<=4?3:1}
function qlen(q){return q>4?300:600}
function qlab(q){return q<=4?'Q'+q:'OT'+(q-4)}
function fmt(c){c=Math.max(0,Math.round(c));return('0'+Math.floor(c/60)).slice(-2)+':'+('0'+c%60).slice(-2)}
function pad(n){return n<10?'0'+n:''+n}
function toCheck(){var p=per(R.q),L=R.log.filter(function(e){return e.k==='to'&&per(e.q)===p});
 if(L.length>=toMax(R.q))return R.q<=2?'Timeout esauriti: max 2 nel primo tempo':R.q<=4?'Timeout esauriti: max 3 nel secondo tempo':'Timeout del supplementare già usato';
 if(R.q===4&&R.clock<=120&&L.filter(function(e){return e.q===4&&e.c<=120}).length>=2)return'Max 2 timeout negli ultimi 2:00 del 4° quarto';return''}
/* geometria campo FIBA (cm, canestro in (750,157.5), linea di fondo in alto) - identica a tiri.html */
var CX=750,CY=157.5,YMAX=1100;
function is3(x,y){var dx=x-CX,dy=y-CY;return Math.abs(dx)>=660||Math.hypot(dx,dy)>=675}

/* ================= derivati dal log (unica fonte di verità) ================= */
function derive(){var g=G(),m={},o={pl:m,our:0,opp:0,tf:{},to:{}};
 ours(g).forEach(function(p){m[p.pk]={p:p,pts:0,f:0,t1:0,u1:0,f2:0,dq:0,fgm:0,fga:0,ftm:0,fta:0}});
 R.log.forEach(function(e){var x=m[e.pk];
  if(e.k==='shot'){if(x){x.fga++;if(e.r){x.fgm++;x.pts+=e.v}}if(e.r)o.our+=e.v}
  else if(e.k==='ft'){if(x){x.fta++;if(e.r){x.ftm++;x.pts++}}if(e.r)o.our++}
  else if(e.k==='foul'){if(x){x.f++;if(e.fl==='T')x.t1++;if(e.fl==='U')x.u1++;if(e.fl==='D')x.f2++}var q=Math.min(e.q,4);o.tf[q]=(o.tf[q]||0)+1}
  else if(e.k==='to'){var p=per(e.q);o.to[p]=(o.to[p]||0)+1}
  else if(e.k==='opp'){o.opp+=e.pts}});
 Object.keys(m).forEach(function(k){var x=m[k];if(x.t1>=2||x.u1>=2||(x.t1>=1&&x.u1>=1)||x.f2>=1)x.dq=1});return o}
function eligible(x){return x&&!x.dq&&x.f<5}
function L(k,o){var e=Object.assign({id:uid('e'),k:k,q:R.q,c:R.clock},o||{});R.log.push(e);return e}

/* ================= cronometro ================= */
function start(){if(U.running||R.over)return;if(R.clock<=0)return toast('Tempo a zero: imposta il cronometro');U.running=true;U.c0=R.clock;U.t0=Date.now();render()}
function stop(){if(!U.running)return;tick();U.running=false;saveR()}
function tick(){var now=Date.now();
 if(U.running){var c=Math.max(0,U.c0-Math.floor((now-U.t0)/1000));if(c!==R.clock){R.clock=c;var el=$('clk');if(el)el.textContent=fmt(c)}
  if(c<=0){U.running=false;saveR();render();flash('flr');toast('Fine tempo');return}
  if(now-U.lastSave>4000){U.lastSave=now;saveR()}}
 if(U.toEnd){var r=Math.ceil((U.toEnd-now)/1000),b=$('tob');if(r<=0){U.toEnd=0;if(b)b.remove();toast('Timeout finito')}else if(b)b.textContent='TIMEOUT 0:'+('0'+r).slice(-2)}}
U.tm=setInterval(tick,250);
function flash(c){var b=$('top');if(!b)return;b.classList.remove('flr','flg');void b.offsetWidth;b.classList.add(c);setTimeout(function(){b.classList.remove(c)},c==='flr'?2800:1500)}

/* ================= azioni ================= */
function needPlayer(){if(!R.pk||R.on.indexOf(R.pk)<0){toast('Tocca prima un giocatore in campo');return null}return derive().pl[R.pk]}
function commitShot(res){if(!R.pk)return toast('Scegli prima il giocatore');if(!U.pend)return toast('Tocca il campo dove è partito il tiro');
 var p=pinfo(R.pk),v=U.pend.v,id=uid('s'),pd=U.pend;
 mutD(function(){D.shots.push({id:id,g:R.g,pk:R.pk,n:p.n,nm:p.nm,x:Math.round(pd.x),y:Math.round(pd.y),r:res,v:v,q:Math.min(R.q,5)})});
 L('shot',{pk:R.pk,n:p.n,r:res,v:v,sid:id});U.pend=null;saveR();render();toast('#'+p.n+' · '+(res?'segnato':'sbagliato')+' da '+v)}
function doFoul(fl){var x=needPlayer();if(!x)return;stop();var on0=R.on.slice();L('foul',{pk:R.pk,n:x.p.n,fl:fl,on0:on0});
 var d=derive().pl[R.pk];U.modal=null;
 if(!eligible(d)){R.on=R.on.filter(function(k){return k!==R.pk});toast('#'+x.p.n+' fuori: '+(d.f>=5?'5 falli':'squalificato'));U.modal={k:'lineup',sel:R.on.slice()}}
 else toast('Fallo a #'+x.p.n+' ('+d.f+')');saveR();render()}
function doTimeout(){var m=toCheck();if(m)return toast(m);stop();L('to');U.toEnd=Date.now()+60000;saveR();render();toast('Timeout')}
function undo(){var e=R.log.pop();if(!e)return toast('Niente da annullare');
 if(e.k==='shot'){mutD(function(){D.shots=D.shots.filter(function(s){return s.id!==e.sid})})}
 if(e.on0)R.on=e.on0.slice();
 if(e.k==='qend'){R.q=e.q;R.clock=e.c;R.over=0}
 U.pend=null;saveR();render();toast('Annullato')}
function prevQuarter(){var i=-1;R.log.forEach(function(e,k){if(e.k==='qend')i=k});if(i<0)return toast('Nessun quarto da riaprire');
 var e=R.log.splice(i,1)[0];R.log.forEach(function(x){if(x.q>e.q)x.q=e.q});
 mutD(function(){D.shots.forEach(function(s){if(s.g===R.g&&s.q>Math.min(e.q,5))s.q=Math.min(e.q,5)})});
 stop();R.q=e.q;R.clock=e.c;R.over=0;U.modal=null;saveR();render();toast('Tornato a '+qlab(e.q))}
function endQuarter(next){stop();L('qend');
 if(next==='over'){R.over=1}else{R.q++;R.clock=qlen(R.q)}
 U.modal=null;U.pend=null;saveR();render();flash('flg');if(!R.over){U.modal={k:'lineup',sel:R.on.slice()};render()}}
function applyLineup(sel){var d=derive(),el=Object.keys(d.pl).filter(function(k){return eligible(d.pl[k])}).length,need=Math.min(5,el);
 if(sel.length!==need)return toast('Servono '+need+' giocatori in campo (ora '+sel.length+')');
 var before=R.on.slice(),ch=before.length!==sel.length||sel.some(function(k){return before.indexOf(k)<0});
 R.on=sel.slice();if(ch&&before.length)L('lineup',{on0:before,on:sel.slice()});
 if(R.on.indexOf(R.pk)<0)R.pk='';U.modal=null;saveR();render();if(ch)toast('Quintetto aggiornato')}

/* ================= viste ================= */
function bars(f){var h='';for(var i=0;i<5;i++)h+='<i class="'+(i<f?'on':'')+'"></i>';return h}
function court(dots,pend){var Ls='fill="none" stroke="#6f7bb0" stroke-width="7"';
 return'<svg id="ct" viewBox="-30 -30 1560 '+(YMAX+60)+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Metà campo">'+
 '<rect x="0" y="0" width="1500" height="1400" '+Ls+'/><rect x="505" y="0" width="490" height="580" '+Ls+'/>'+
 '<path d="M570 580 A180 180 0 0 0 930 580" '+Ls+'/><path d="M570 580 A180 180 0 0 1 930 580" '+Ls+' stroke-dasharray="22 18"/>'+
 '<path d="M625 120 V157.5 A125 125 0 0 0 875 157.5 V120" '+Ls+'/><path d="M90 0 V299 A675 675 0 0 0 1410 299 V0" '+Ls+'/>'+
 '<path d="M660 120 H840 M750 120 V135" '+Ls+' stroke-width="11"/><circle cx="750" cy="157.5" r="22.5" '+Ls+' stroke="#d9b52a"/>'+dots+(pend||'')+'</svg>'}
function dot(s){var c=s.r?'#2ecc71':'#ff5d6c';
 return s.r?'<circle cx="'+s.x+'" cy="'+s.y+'" r="30" fill="'+c+'" fill-opacity=".9" stroke="#06240f" stroke-width="5"/><text x="'+s.x+'" y="'+(s.y+11)+'" fill="#06240f" font-size="32" font-weight="900" text-anchor="middle" style="pointer-events:none">'+esc(s.n)+'</text>'
 :'<path d="M'+(s.x-24)+' '+(s.y-24)+' L'+(s.x+24)+' '+(s.y+24)+' M'+(s.x+24)+' '+(s.y-24)+' L'+(s.x-24)+' '+(s.y+24)+'" stroke="'+c+'" stroke-width="14" stroke-linecap="round"/><text x="'+(s.x+34)+'" y="'+(s.y-26)+'" fill="#ff9aa5" font-size="30" font-weight="900" style="pointer-events:none">'+esc(s.n)+'</text>'}
function viewPk(){return U.fp==='pick'?U.vpk:R.pk}
function shown(){var vk=viewPk();return D.shots.filter(function(s){return s.g===R.g&&(U.fp==='all'||s.pk===vk)&&(!U.fq||s.q===U.fq)})}
function sumCell(a){var t=a.length,mk=a.filter(function(s){return s.r}).length;return t?mk+'/'+t:'–'}
function rowTxt(e){var n='#'+esc(e.n||'');
 if(e.k==='shot')return'<span><b>'+n+'</b></span><span class="'+(e.r?'okc':'kc')+'">'+e.v+' pt '+(e.r?'segnato':'sbagliato')+'</span>';
 if(e.k==='ft')return'<span><b>'+n+'</b></span><span class="'+(e.r?'okc':'kc')+'">tiro libero '+(e.r?'segnato':'sbagliato')+'</span>';
 if(e.k==='foul')return'<span><b>'+n+'</b></span><span>fallo '+({P:'personale',T:'tecnico',U:'antisportivo',D:'squalificante'}[e.fl]||'')+'</span>';
 if(e.k==='to')return'<span>Timeout</span>';if(e.k==='opp')return'<span>Avversari +'+e.pts+'</span>';
 if(e.k==='lineup')return'<span>Cambio quintetto</span>';if(e.k==='qend')return'<span><b>Fine '+qlab(e.q)+'</b></span>';return''}
function logHtml(){var our=0,opp=0,rows=[];
 R.log.forEach(function(e){if(e.k==='shot'&&e.r)our+=e.v;if(e.k==='ft'&&e.r)our++;if(e.k==='opp')opp+=e.pts;rows.push('<div><span style="color:var(--mu);width:34px">'+qlab(e.q)+'</span>'+rowTxt(e)+'<span class="t">'+fmt(e.c)+' · '+our+'-'+opp+'</span></div>')});
 return'<div class="log" id="log">'+(rows.slice(-3).reverse().join('')||'<div style="color:var(--mu)">Nessun evento ancora</div>')+'</div>'}
function gameView(){var g=G(),d=derive(),qn=Math.min(R.q,4),tf=d.tf[qn]||0,p=per(R.q),usedTo=d.to[p]||0,sh=shown(),mk=sh.filter(function(s){return s.r}).length,sp=viewPk()&&pinfo(viewPk());
 var top='<div class="top" id="top"><button class="menu" data-a="menu" aria-label="Menu">☰</button><div class="team">'+esc(g.sq)+'</div><div class="fl3'+(tf>=5?' bn':'')+'" title="Falli di squadra nel quarto">'+[0,1,2,3,4].map(function(i){return'<i class="'+(i<tf?'on':'')+'"></i>'}).join('')+'</div>'+
  '<div class="to">TO <b>'+usedTo+'/'+toMax(R.q)+'</b></div><div class="sc y">'+pad(d.our)+'</div><div class="q">'+(R.over?'FINE':qlab(R.q))+'</div><button class="clk" id="clk" data-a="setclk">'+fmt(R.clock)+'</button><div class="sc bl">'+pad(d.opp)+'</div><div class="opp">'+esc(g.av||'Avversari')+'</div>'+
  '<button class="go'+(U.running?' st':'')+'" data-a="run">'+(U.running?'■ STOP':'▶ AVVIA')+'</button>'+(U.toEnd?'<div class="tob" id="tob">TIMEOUT</div>':'')+'</div>';
 var pl='<div class="pl">'+R.on.slice().map(function(k){return d.pl[k]}).filter(Boolean).sort(function(a,b){return byNum(a.p,b.p)}).map(function(x){
  return'<button class="p'+(R.pk===x.p.pk?' sel':'')+'" data-a="pl" data-v="'+esc(x.p.pk)+'" aria-label="'+esc(x.p.nm)+'"><span class="bars">'+bars(x.f)+'</span><span class="n">'+esc(x.p.n||'?')+'</span><small>'+x.pts+' pt · '+x.f+' f</small><em>'+x.fgm+'/'+x.fga+'</em></button>'}).join('')+'<button class="bench" data-a="lineup">PANCHINA / CAMBI</button></div>';
 var fl='<div class="fl"><button class="c'+(U.fp==='sel'||U.fp==='pick'?' on':'')+'" data-a="fp" data-v="sel">'+(sp?'#'+esc(sp.n):'Gioc.')+'</button><button class="c'+(U.fp==='all'?' on':'')+'" data-a="fp" data-v="all">Tutti</button><hr>'+
  [[0,'Tot'],[1,'Q1'],[2,'Q2'],[3,'Q3'],[4,'Q4'],[5,'OT']].map(function(o){return'<button class="c'+(U.fq===o[0]?' on':'')+'" data-a="fq" data-v="'+o[0]+'">'+o[1]+'</button>'}).join('')+
  '<hr><button class="c" data-a="sum">Tabella</button><div class="fs"><b>'+mk+'/'+sh.length+'</b>'+(sh.length?Math.round(100*mk/sh.length)+'%':'–')+'</div></div>';
 var pend=U.pend?'<circle cx="'+U.pend.x+'" cy="'+U.pend.y+'" r="48" fill="none" stroke="#ffd93a" stroke-width="10"/><circle cx="'+U.pend.x+'" cy="'+U.pend.y+'" r="12" fill="#ffd93a"/><text x="'+U.pend.x+'" y="'+Math.max(60,U.pend.y-68)+'" fill="#ffd93a" font-size="54" font-weight="900" text-anchor="middle" style="pointer-events:none">'+U.pend.v+' PUNTI</text>':'';
 var ct='<div class="court"><div class="cap">'+(U.fp!=='all'?(sp?'Tiri di #'+esc(sp.n)+' '+esc(sp.nm):'Scegli un giocatore'):'Tutti i tiri')+' · '+(U.fq?qlab(U.fq<5?U.fq:5):'tutti i quarti')+'</div>'+court(sh.map(dot).join(''),pend)+'</div>';
 var ac='<div class="ac"><button class="b r1" data-a="res" data-v="1">● Segnato</button><button class="b r0" data-a="res" data-v="0">✕ Sbagliato</button>'+
  '<div class="g3"><button class="b'+(U.pend&&U.pend.v===2?' on':'')+'" data-a="pts" data-v="2">2</button><button class="b'+(U.pend&&U.pend.v===3?' on':'')+'" data-a="pts" data-v="3">3</button><button class="b" data-a="ft" style="flex:1.5">T. liberi</button></div>'+
  '<button class="b w" data-a="foul">Fallo</button><button class="b w" data-a="other">Altri falli</button><button class="b w" data-a="to">Timeout</button><button class="b w" data-a="undo">↩ Annulla</button>'+
  '<button class="b w lu" data-a="lineup">Cambi</button><button class="b w qe" data-a="qend">'+(R.over?'Partita finita':'Fine quarto')+'</button>'+
  '<div class="g3"><button class="b" data-a="opp" data-v="1">+1 AV</button><button class="b" data-a="opp" data-v="2">+2 AV</button><button class="b" data-a="opp" data-v="3">+3 AV</button></div></div>';
 return'<div class="app">'+top+'<div class="main">'+pl+fl+ct+logHtml()+ac+'</div></div>'}

function liveCard(){if(!window.rbSync||!rbSync.on||!rbSync.liveWatch)return'';
 var h='<div class="card"><b>📋 Dal referto</b>';if(U.live===null)return h+'<div class="hint" style="margin-top:6px">Collegamento al referto in corso…</div></div>';
 var Ls=U.live.filter(function(x){return x.u>Date.now()-36*36e5}).sort(function(a,b){return b.u-a.u});
 if(!Ls.length)return h+'<div class="hint" style="margin-top:6px">Nessun referto recente. Sull\'altro dispositivo apri il referto e importa i convocati: compare qui da solo.</div></div>';
 return h+Ls.map(function(x){var t=x.teams||[],A=t[0]||{},B=t[1]||{},mi=A.mine&&!B.mine?0:B.mine&&!A.mine?1:-1,ex=D.games.filter(function(g){return g.gid===x.gid})[0],hm=new Date(x.u).toTimeString().slice(0,5);
  return'<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--ln)"><b>'+esc(A.name||'?')+'</b> vs <b>'+esc(B.name||'?')+'</b><div class="hint">'+(x.st==='setup'?'in preparazione':'in corso')+' · '+(A.p||[]).length+' + '+(B.p||[]).length+' convocati · aggiornato '+hm+'</div><div class="row">'+
   (ex||mi>=0?'<button class="gold" data-a="live" data-v="'+esc(x.gid)+'" data-i="'+(ex&&ex.mi!=null?ex.mi:mi)+'">'+(ex?'Continua':'Usa questa partita')+'</button>':'<button class="gold" data-a="live" data-v="'+esc(x.gid)+'" data-i="0">Siamo '+esc(A.name||'A')+'</button><button class="gold" data-a="live" data-v="'+esc(x.gid)+'" data-i="1">Siamo '+esc(B.name||'B')+'</button>')+'</div></div>'}).join('')+'</div>'}
function setupView(){var tm=teams();
 return'<div class="wrap"><h1>⏱ Referto + Tiri</h1><div class="hint">Referto di una sola squadra con la mappa dei tiri. I tiri finiscono nella pagina <b>Mappa dei tiri</b>.</div>'+liveCard()+
  '<div class="card"><b>Oppure crea la partita a mano</b><label for="ns">Squadra</label><select id="ns">'+tm.map(function(t){return'<option>'+esc(t)+'</option>'}).join('')+(tm.length?'':'<option value="">(da inserire a mano)</option>')+'</select>'+
  (tm.length?'':'<label for="nsx">Nome squadra</label><input id="nsx" placeholder="es. U16 Maschile">')+
  '<label for="nv">Avversario</label><input id="nv" placeholder="es. Virtus Cernusco" autocomplete="off"><label for="nd">Data</label><input id="nd" type="date" value="'+today()+'">'+
  '<div class="row" style="margin-top:14px"><button class="gold" data-a="crea">Inizia partita</button></div></div><div class="row"><button onclick="location.href=\'home.html\'">← Home</button></div></div>'}

function modalView(){var m=U.modal;if(!m)return'';var h='';
 if(m.k==='lineup'){var d=derive(),ps=ours(G()).slice().sort(byNum),el=ps.filter(function(p){return eligible(d.pl[p.pk])}).length,need=Math.min(5,el);
  h='<h3>Giocatori in campo</h3><div class="hint">'+m.sel.length+'/'+need+' selezionati · tocca per mettere in campo o in panchina · si vedono punti e falli</div><div class="lg">'+
   ps.map(function(p){var x=d.pl[p.pk],ok=eligible(x),on=m.sel.indexOf(p.pk)>=0;return'<button class="lp'+(on?' on':'')+'"'+(ok?' data-a="lutog" data-v="'+esc(p.pk)+'"':' disabled')+'><span class="n">'+esc(p.n||'?')+'</span><small>'+esc(p.nm)+'</small><small>'+x.pts+' pt · '+x.f+' f'+(ok?'':' · fuori')+'</small></button>'}).join('')+'<button class="lp" data-a="extra"><span class="n">＋</span><small>Aggiungi</small></button></div>'+
   '<div class="mr"><button data-a="mclose">Annulla</button><button class="ok" data-a="luok">Conferma quintetto</button></div>'}
 else if(m.k==='ft'){var sp=pinfo(R.pk);h='<h3>Tiri liberi · #'+esc(sp?sp.n:'?')+'</h3><div class="hint">Registrati: '+(m.res.map(function(r){return r?'●':'✕'}).join(' ')||'nessuno')+'</div><div class="big"><button style="background:var(--ok)" data-a="ftr" data-v="1">● Segnato</button><button style="background:var(--no)" data-a="ftr" data-v="0">✕ Sbagliato</button></div><div class="mr"><button class="ok" data-a="mclose">Fine</button></div>'}
 else if(m.k==='other'){var sp2=pinfo(R.pk);h='<h3>Altri falli · #'+esc(sp2?sp2.n:'?')+'</h3><div class="hint">Due tecnici, due antisportivi, tecnico + antisportivo o uno squalificante: il giocatore esce.</div><button class="mi" data-a="fl" data-v="P">Fallo personale</button><button class="mi" data-a="fl" data-v="T">Tecnico</button><button class="mi" data-a="fl" data-v="U">Antisportivo</button><button class="mi" data-a="fl" data-v="D">Squalificante / flagrante</button><div class="mr"><button data-a="mclose">Annulla</button></div>'}
 else if(m.k==='qend'){var ot=R.q>=4;h='<h3>'+(ot?'Fine '+qlab(R.q):'Fine '+qlab(R.q)+'?')+'</h3><div class="hint">Il cronometro si ferma e puoi impostare il quintetto del prossimo periodo.</div>'+
   (ot?'<button class="mi" data-a="qok" data-v="next" style="background:var(--blue)">Inizia supplementare ('+qlab(R.q+1)+')</button><button class="mi" data-a="qok" data-v="over" style="background:var(--no)">Termina la partita</button>':'<button class="mi" data-a="qok" data-v="next" style="background:var(--ok)">Conferma: vai a '+qlab(R.q+1)+'</button>')+'<div class="mr"><button data-a="mclose">Annulla</button></div>'}
 else if(m.k==='clk'){h='<h3>Imposta cronometro</h3><div class="row" style="margin:10px 0"><input id="cm" type="number" min="0" max="99" inputmode="numeric" value="'+Math.floor(R.clock/60)+'"><input id="cs" type="number" min="0" max="59" inputmode="numeric" value="'+R.clock%60+'"></div><div class="hint">minuti · secondi</div><div class="mr"><button data-a="mclose">Annulla</button><button class="ok" data-a="clkok">Imposta</button></div>'}
 else if(m.k==='sum'){var psx=ours(G()).slice().sort(byNum),shx=D.shots.filter(function(s){return s.g===R.g}),cols=[1,2,3,4,5];
  h='<h3>Tiri per quarto</h3><div class="hint">Tocca un giocatore per vedere i suoi tiri sul campo, un quarto per vedere tutta la squadra in quel periodo, Tot per tutta la gara.</div><div style="overflow:auto"><table class="st"><tr><th>Giocatore</th>'+cols.map(function(q){return'<th><button class="c" data-a="sumq" data-v="'+q+'">'+(q<5?'Q'+q:'OT')+'</button></th>'}).join('')+'<th><button class="c" data-a="sumq" data-v="0">Tot</button></th></tr>'+
   psx.filter(function(p){return shx.some(function(s){return s.pk===p.pk})}).map(function(p){var a=shx.filter(function(s){return s.pk===p.pk});return'<tr data-a="sumpl" data-v="'+esc(p.pk)+'"><td>#'+esc(p.n)+' '+esc(p.nm)+'</td>'+cols.map(function(q){return'<td>'+sumCell(a.filter(function(s){return s.q===q}))+'</td>'}).join('')+'<td><b>'+sumCell(a)+'</b></td></tr>'}).join('')+
   '<tr class="tt"><td><b>Squadra</b></td>'+cols.map(function(q){return'<td>'+sumCell(shx.filter(function(s){return s.q===q}))+'</td>'}).join('')+'<td><b>'+sumCell(shx)+'</b></td></tr></table></div>'+(shx.length?'':'<div class="hint" style="margin-top:8px">Ancora nessun tiro registrato.</div>')+'<div class="mr"><button class="ok" data-a="mclose">Chiudi</button></div>'}
 else if(m.k==='menu'){h='<h3>Menu</h3><button class="mi" data-a="sum">📊 Tiri per giocatore e quarto</button><button class="mi" data-a="prevq">↩ Torna al quarto precedente</button><button class="mi" data-a="lineup">Giocatori e quintetto</button><button class="mi" onclick="location.href=\'tiri.html\'">🎯 Mappa dei tiri (statistiche)</button><button class="mi" onclick="location.href=\'home.html\'">← Home</button><button class="mi" data-a="newg" style="color:#ff8a96">Nuova partita…</button><div class="mr"><button data-a="mclose">Chiudi</button></div>'}
 return'<div class="mo" data-a="mbg"><div class="md">'+h+'</div></div>'}
function render(){var a=$('app'),g=G();
 if(!g){a.innerHTML=setupView();return}
 if(!R.on.length&&!U.modal&&!R.over)U.modal={k:'lineup',sel:[]};
 a.innerHTML=gameView()+modalView();saveR()}

/* ================= eventi ================= */
function svPt(e,sv){var p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var q=p.matrixTransform(sv.getScreenCTM().inverse());return{x:q.x,y:q.y}}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');
 if(b){var a=b.dataset.a,v=b.dataset.v;
  if(a==='mbg'&&e.target!==b)return;
  if(a==='mbg'||a==='mclose'){U.modal=null}
  else if(a==='live'){newGameFromLive(v,+b.dataset.i||0);return}
  else if(a==='crea'){var tm=teams(),sq=tm.length?$('ns').value:($('nsx')&&$('nsx').value.trim());if(!sq){toast('Scrivi il nome della squadra');return}
   var g={id:uid('g'),sq:sq,av:$('nv').value.trim(),d:$('nd').value||today(),extra:[]};mutD(function(){D.games.push(g);D.cur=g.id});startGame(g.id);return}
  else if(a==='pl'){R.pk=v;U.pend=null;if(U.fp==='pick')U.fp='sel'}
  else if(a==='sum'){U.modal={k:'sum'}}
  else if(a==='sumpl'){U.fp='pick';U.vpk=v;U.modal=null}
  else if(a==='sumq'){U.fq=+v;U.fp='all';U.modal=null}
  else if(a==='fp'){U.fp=v}
  else if(a==='fq'){U.fq=+v}
  else if(a==='run'){U.running?stop():start()}
  else if(a==='res'){commitShot(+v);return}
  else if(a==='pts'){if(U.pend){U.pend.v=+v}else toast('Prima tocca il campo')}
  else if(a==='ft'){if(!needPlayer())return;U.modal={k:'ft',res:[]}}
  else if(a==='ftr'){var x=needPlayer();if(!x)return;L('ft',{pk:R.pk,n:x.p.n,r:+v});U.modal.res.push(+v);saveR()}
  else if(a==='foul'){doFoul('P');return}
  else if(a==='other'){if(!needPlayer())return;U.modal={k:'other'}}
  else if(a==='fl'){doFoul(v);return}
  else if(a==='to'){doTimeout();return}
  else if(a==='undo'){undo();return}
  else if(a==='opp'){L('opp',{pts:+v});saveR();toast('Avversari +'+v)}
  else if(a==='lineup'){U.modal={k:'lineup',sel:R.on.slice()}}
  else if(a==='lutog'){var s=U.modal.sel,i=s.indexOf(v);if(i>=0)s.splice(i,1);else{if(s.length>=5)return toast('Massimo 5 giocatori in campo');s.push(v)}}
  else if(a==='luok'){applyLineup(U.modal.sel);return}
  else if(a==='extra'){var n=prompt('Numero di maglia del giocatore:');if(!n)return;n=n.trim().slice(0,3);var nm=(prompt('Nome (facoltativo):')||'').trim()||('N° '+n),pk='x|'+norm(n)+'|'+norm(nm);
   mutD(function(){var gg=D.games.filter(function(z){return z.id===R.g})[0];gg.extra=gg.extra||[];if(!gg.extra.some(function(p){return p.pk===pk}))gg.extra.push({pk:pk,n:n,nm:nm,t:0})})}
  else if(a==='qend'){if(R.over)return;U.modal={k:'qend'}}
  else if(a==='qok'){endQuarter(v);return}
  else if(a==='setclk'){stop();U.modal={k:'clk'}}
  else if(a==='clkok'){var m=Math.max(0,Math.min(99,parseInt($('cm').value)||0)),s2=Math.max(0,Math.min(59,parseInt($('cs').value)||0));R.clock=m*60+s2;U.modal=null;saveR()}
  else if(a==='menu'){U.modal={k:'menu'}}
  else if(a==='prevq'){prevQuarter();return}
  else if(a==='newg'){if(!confirm('Chiudere questa partita e iniziarne una nuova? I tiri restano salvati nella Mappa dei tiri.'))return;stop();R=defR();U.pend=null;U.modal=null;saveR()}
  render();return}
 var sv=e.target.closest('#ct');if(!sv||U.modal)return;var q=svPt(e,sv);
 if(q.x<-30||q.x>1530||q.y<-30||q.y>YMAX+30)return;
 if(!R.pk){toast('Scegli prima il giocatore');return}
 var x=Math.max(0,Math.min(1500,q.x)),y=Math.max(0,Math.min(YMAX,q.y));U.pend={x:x,y:y,v:is3(x,y)?3:2};render()});
if(window.rbSync&&rbSync.on&&rbSync.liveWatch)rbSync.liveWatch(function(r){U.live=r||[];var a=document.activeElement;if(!G()&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()});
render();
</script></body></html>
