<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Referto + Tiri</title><meta name="theme-color" content="#12183a">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#060b20;--bar:#12183a;--pan:#0d1330;--row:#1a2150;--ln:#2a3570;--tx:#fff;--mu:#8d96c8;--ok:#1fa35c;--no:#a32636;--gold:#ffd93a;--blue:#0b2a8a;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,sans-serif;font-size:14px;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:var(--row);border-radius:8px;cursor:pointer;font-weight:800}
button:disabled{opacity:.35;cursor:default}
input,select{font:inherit;color:inherit;background:var(--pan);border:1px solid var(--ln);border-radius:8px;min-height:44px;padding:0 10px;width:100%;-webkit-user-select:text;user-select:text}
label{display:block;color:var(--mu);font-size:12px;font-weight:700;margin:10px 0 4px}
#rbcloud{top:2px!important;bottom:auto!important;right:auto!important;left:64px!important;font-size:9px!important;opacity:.7}
.app{height:100dvh;display:flex;flex-direction:column}
/* barra */
.top{flex:none;height:58px;display:flex;align-items:center;justify-content:center;gap:14px;background:var(--bar);border-bottom:1px solid #1e2650;position:relative;padding:0 76px 0 56px}
.top.flr{animation:flr .5s ease-in-out 5}.top.flg{animation:flg .6s ease-in-out 2}
@keyframes flr{0%,100%{background:var(--bar)}50%{background:#e11d2b}}
@keyframes flg{0%,100%{background:var(--bar)}50%{background:#1fa35c}}
.menu{position:absolute;left:8px;top:7px;width:44px;height:44px;background:none;font-size:26px;color:var(--mu)}
.team{font-weight:900;font-size:15px;border:2px solid #2fd16a;background:#0a3b24;padding:4px 10px;border-radius:7px;max-width:22vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl3{display:flex;gap:3px}.fl3 i{width:11px;height:24px;border:2px solid #3a4378;border-radius:2px}.fl3 i.on{background:var(--gold);border-color:var(--gold)}.fl3.bn i.on{background:#ff5a5a;border-color:#ff5a5a}
.to{font-size:11px;color:var(--mu);font-weight:700;white-space:nowrap}.to b{background:#232b57;color:#fff;padding:3px 6px;border-radius:4px;margin-left:3px}
.sc{font-weight:900;font-size:30px;padding:0 10px;border-radius:5px;line-height:1.25}.y{background:var(--gold);color:#000}.bl{background:var(--blue)}
.q{font-size:13px;font-weight:800;color:#9aa3d8}
.clk{background:none;font-size:42px;font-weight:900;padding:0 4px;min-width:118px}
.opp{font-size:10px;color:var(--mu);font-weight:700;text-align:center;line-height:1.2;max-width:15vw;overflow:hidden}
.go{position:absolute;right:8px;top:8px;height:42px;background:var(--ok);padding:0 18px;font-size:13px}.go.st{background:var(--no)}
.tob{position:absolute;left:50%;transform:translateX(-50%);bottom:-22px;background:#e11d2b;color:#fff;font-weight:900;font-size:12px;padding:2px 14px;border-radius:0 0 8px 8px;z-index:6}
/* corpo */
.main{flex:1;min-height:0;display:grid;gap:8px;padding:8px;grid-template-columns:92px 60px minmax(0,1fr) 210px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"pl fl court ac" "pl fl log ac"}
.pl{grid-area:pl;display:flex;flex-direction:column;gap:6px;min-height:0}
.p{flex:1 1 0;min-height:0;min-width:0;background:var(--gold);color:#000;border-radius:8px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.p .n{font-size:34px;font-weight:900;line-height:1}.p small{font-size:11px;font-weight:800}.p em{font-style:normal;font-size:10px;font-weight:700;opacity:.65}
.p.sel{outline:4px solid #fff;outline-offset:-4px}
.bars{position:absolute;left:5px;top:8px;bottom:8px;width:6px;display:flex;flex-direction:column-reverse;gap:2px}.bars i{flex:1;background:rgba(0,0,0,.18)}.bars i.on{background:rgba(0,0,0,.75)}
.bench{flex:none;height:40px;background:var(--bar);color:#9aa3d8;font-size:11px}
.fl{grid-area:fl;display:flex;flex-direction:column;gap:6px;min-height:0}
.c{background:var(--row);border-radius:7px;font-weight:800;font-size:13px;min-height:38px;padding:4px;flex:none}.c.on{background:var(--gold);color:#000}
.fl hr{border:0;height:6px}.fs{margin-top:auto;font-size:10px;text-align:center;color:var(--mu);font-weight:700;line-height:1.3}.fs b{display:block;color:#fff;font-size:13px}
.court{grid-area:court;background:var(--pan);border-radius:12px;min-height:0;min-width:0;position:relative;overflow:hidden}
.court svg{position:absolute;inset:0;width:100%;height:100%}
.cap{position:absolute;left:12px;top:8px;font-size:11px;font-weight:800;color:var(--gold);z-index:2;pointer-events:none}
.log{grid-area:log;background:#000;border-radius:8px;font-size:12px;overflow:hidden;min-height:0}
.log div{display:flex;gap:10px;padding:6px 10px;border-left:3px solid var(--gold);border-bottom:1px solid #12183a;white-space:nowrap}
.log .t{margin-left:auto;color:var(--mu)}.okc{color:#2fd16a;font-weight:800}.kc{color:#ff5a5a;font-weight:800}
.ac{grid-area:ac;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:2fr 2fr .8fr 1fr 1fr 1fr .8fr;gap:6px;min-height:0}
.ac .b{background:var(--bar);border-bottom:3px solid #232b57;font-size:13px;min-height:0}
.ac .r1{background:var(--ok);border-color:#26c473;font-size:20px;grid-column:1/3}.ac .r0{background:var(--no);border-color:#d03a4c;font-size:20px;grid-column:1/3}
.g3{grid-column:1/-1;display:flex;gap:6px;min-height:0}.g3 .b{flex:1}.g3 .on{background:var(--blue);border-color:#3b63ff}
.ac .w{grid-column:span 1}.ac .qe{background:var(--blue);border-color:#3b63ff}
@media (orientation:portrait){
 .top{gap:8px;padding:0 70px 0 46px;height:62px}.opp{display:none}.team{max-width:90px;font-size:13px}.sc{font-size:26px}.clk{font-size:34px;min-width:100px}.menu{left:2px}.fl3 i{width:9px}
 .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 108px auto auto;grid-template-areas:"fl" "court" "pl" "ac" "log"}
 .fl{flex-direction:row;flex-wrap:wrap;align-items:center}.fl hr{width:8px;height:0}.fs{margin:0 0 0 auto;display:flex;gap:8px;align-items:center}.fs b{display:inline}
 .pl{flex-direction:row}.p .n{font-size:38px}.bench{display:none}
 .ac{grid-template-columns:repeat(4,1fr);grid-template-rows:84px 50px 50px 50px 50px}
 .ac .r1,.ac .r0{grid-column:span 2}.ac .w{grid-column:span 1}.ac .lu,.ac .qe{grid-column:span 2}
 .log{max-height:84px}
}
@media (max-width:1100px) and (orientation:landscape){.main{grid-template-columns:80px 54px minmax(0,1fr) 180px}.p .n{font-size:28px}.clk{font-size:36px}}
/* modali */
.mo{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:30;padding:10px}
.md{background:#141b3d;border-radius:14px;padding:16px;width:min(720px,100%);max-height:94dvh;overflow:auto;border:1px solid var(--ln)}
.md h3{font-size:18px;margin-bottom:4px}.hint{color:var(--mu);font-size:12px;line-height:1.45;margin-bottom:10px}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0}
.lp{background:#232b57;border-radius:8px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.lp .n{font-size:30px;font-weight:900;line-height:1}.lp small{font-size:10px;font-weight:700;color:#c6cdf0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp.on{background:var(--gold);color:#000}.lp.on small{color:#000}
.mr{display:flex;gap:8px;margin-top:10px}.mr button{flex:1;min-height:52px;font-size:15px}.mr .ok{background:var(--ok)}
.big{display:flex;gap:8px;margin:10px 0}.big button{flex:1;min-height:90px;font-size:20px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--ln)}.tbl td:first-child,.tbl th:first-child{text-align:left}.tbl tr[data-a]{cursor:pointer}.tbl tr[data-a]:active{background:#232b57}.tbl .c{min-height:32px;padding:2px 8px}.tbl .tt td{border-top:2px solid var(--ln)}
.lvb{position:absolute;right:8px;top:14px;font-size:11px;font-weight:900;padding:6px 10px;border-radius:14px;background:#0a3b24;color:#2fd16a;border:1px solid #2fd16a}
.lvb.sh{right:106px}.lvb.off{background:#4a2a08;color:#ffb347;border-color:#ffb347}.lvb.man{background:#ffb347;color:#000;border-color:#ffb347}
.ac.lk{grid-template-rows:3fr 3fr 1fr 1fr 1fr}.ac.lk .b.w{grid-column:span 1}.ac.lk .b.full{grid-column:1/-1}
@media (orientation:portrait){.ac.lk{grid-template-rows:84px 50px 50px 50px}.ac.lk .b.w{grid-column:span 2}.ac.lk .b.full{grid-column:1/-1}}
.eds{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;background:#141b3dee;border:1px solid var(--ln);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}.eds button{min-height:38px;padding:0 10px;font-size:12px}
.mi{display:block;width:100%;text-align:left;padding:14px;margin-top:6px;min-height:50px;font-size:14px}
.card{background:var(--pan);border-radius:12px;padding:12px;margin-bottom:10px}
.wrap{max-width:760px;margin:0 auto;padding:14px;height:100dvh;overflow:auto;-webkit-user-select:text}
.wrap h1{font-size:20px;margin-bottom:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1;min-height:48px}
.gold{background:var(--gold)!important;color:#111}
#toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000e;border:1px solid var(--ln);padding:9px 16px;border-radius:20px;font-weight:700;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}#toast.on{opacity:1}
</style></head><body>

<script>
richiediLogin();
/* ================= dati =================
   Tiri e partite: STESSA chiave di tiri.html (rb_tiri_v1) -> la scheda "Mappa" di tiri.html vede subito questi tiri.
   Referto di squadra (log eventi, quintetto, cronometro): chiave propria rb_rt_v1. */
var KT='rb_tiri_v1',KR='rb_rt_v1';
function $(i){return document.getElementById(i)}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'')}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fd(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function toast(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=''},1800)}
function loadT(){try{var o=JSON.parse(localStorage.getItem(KT)||'null');if(o&&Array.isArray(o.games)&&Array.isArray(o.shots))return o}catch(e){}return{games:[],shots:[],cur:''}}
var D=loadT();
function mutD(fn){D=loadT();fn();try{localStorage.setItem(KT,JSON.stringify(D))}catch(e){toast('Memoria piena: esporta un backup dalla pagina Mappa dei tiri')}}
function defR(){return{g:'',q:1,clock:600,log:[],on:[],pk:'',over:0}}
function loadR(){try{var o=JSON.parse(localStorage.getItem(KR)||'null');if(o&&Array.isArray(o.log))return Object.assign(defR(),o)}catch(e){}return defR()}
var R=loadR();
function saveR(){try{localStorage.setItem(KR,JSON.stringify(R))}catch(e){}}
var U={running:false,c0:0,t0:0,pend:null,fp:'sel',fq:0,modal:null,live:null,toEnd:0,tm:null,lastSave:0};
function G(){return D.games.filter(function(g){return g.id===R.g})[0]||null}

/* ================= squadre e giocatori (come in tiri.html) ================= */
function teamLabel(x){return((x.squadra||'')+' '+(x.genere||'')).trim()}
function teams(){var m={};anagGet().forEach(function(x){if(x.tipo==='giocatore'&&teamLabel(x))m[teamLabel(x)]=1});return Object.keys(m).sort()}
function roster(sq){return anagGet().filter(function(x){return x.tipo==='giocatore'&&teamLabel(x)===sq}).map(function(x){return{pk:'g|'+norm(x.cognome)+'|'+norm(x.nome),n:String(x.numero==null?'':x.numero),nm:((x.cognome||'')+' '+(x.nome||'')).trim(),t:0}}).sort(byNum)}
function byNum(a,b){return(parseInt(a.n)||999)-(parseInt(b.n)||999)}
function ours(g){if(!g)return[];var r=(g.roster&&g.roster.length)?g.roster.filter(function(p){return!p.t}):roster(g.sq);return r.concat((g.extra||[]).filter(function(p){return!p.t}))}
function pinfo(pk){return ours(G()).filter(function(p){return p.pk===pk})[0]}
function mapPlayers(ps,t){var A=anagGet().filter(function(x){return x.tipo==='giocatore'});
 return ps.map(function(p){var k=norm(p.name),f=t===0&&A.filter(function(x){return norm((x.cognome||'')+(x.nome||''))===k||norm((x.nome||'')+(x.cognome||''))===k})[0];
  return{pk:f?'g|'+norm(f.cognome)+'|'+norm(f.nome):(t===0?'r|':'o|')+norm(p.name)+'|'+norm(p.n),n:String(p.n),nm:p.name,t:t}}).sort(byNum)}
function hidList(){try{return JSON.parse(localStorage.getItem('rb_rt_hide')||'[]')}catch(e){return[]}}
function hideLive(g){var h=hidList();if(h.indexOf(g)<0)h.push(g);try{localStorage.setItem('rb_rt_hide',JSON.stringify(h.slice(-50)))}catch(e){}}
function liveDoc(gid){return(U.live||[]).filter(function(x){return x.gid===gid})[0]}
function newGameFromLive(gid,i){var x=liveDoc(gid);if(!x)return;var ex=D.games.filter(function(g){return g.gid===gid})[0];
 if(!ex){var t=x.teams||[],me=t[i]||{},op=t[1-i]||{};
  ex={id:uid('g'),gid:gid,mi:i,sq:me.name||'Squadra',av:op.name||'',d:(x.d||'').slice(0,10)||today(),extra:[],roster:mapPlayers(me.p||[],0).concat(mapPlayers(op.p||[],1))};
  mutD(function(){D.games.push(ex);D.cur=ex.id})}
 startGame(ex.id)}
function startGame(id){R=defR();R.g=id;U.pend=null;U.running=false;U.manual=0;U.luAsked=0;saveR();if(linked())applyLive();else render()}

/* ================= regole (FIBA) ================= */
function per(q){return q<=2?1:q<=4?2:q}
function toMax(q){return q<=2?2:q<=4?3:1}
function qlen(q){return q>4?300:600}
function qlab(q){return q<=4?'Q'+q:'OT'+(q-4)}
function fmt(c){c=Math.max(0,Math.round(c));return('0'+Math.floor(c/60)).slice(-2)+':'+('0'+c%60).slice(-2)}
function pad(n){return n<10?'0'+n:''+n}
function toCheck(){var p=per(R.q),L=R.log.filter(function(e){return e.k==='to'&&per(e.q)===p});
 if(L.length>=toMax(R.q))return R.q<=2?'Timeout esauriti: max 2 nel primo tempo':R.q<=4?'Timeout esauriti: max 3 nel secondo tempo':'Timeout del supplementare già usato';
 if(R.q===4&&R.clock<=120&&L.filter(function(e){return e.q===4&&e.c<=120}).length>=2)return'Max 2 timeout negli ultimi 2:00 del 4° quarto';return''}
/* geometria campo FIBA (cm, canestro in (750,157.5), linea di fondo in alto) - identica a tiri.html */
var CX=750,CY=157.5,YMAX=1100;
function is3(x,y){var dx=x-CX,dy=y-CY;return Math.abs(dx)>=660||Math.hypot(dx,dy)>=675}

function zone(x,y,v){var dx=x-CX,dy=y-CY,d=Math.hypot(dx,dy);
 if(v===2){if(d<250)return'Area';if(x>=505&&x<=995&&y<=580)return'Pitturato';return x<505?'Media sx':x>995?'Media dx':'Media centro'}
 if(y<299)return x<CX?'Angolo sx':'Angolo dx';if(Math.abs(dx)<=300)return'Tripla centro';return dx<0?'Tripla ala sx':'Tripla ala dx'}
/* ============ mappa a zone: colore = punti per tiro della zona (zone come in "Per zona") ============ */
function zFill(o){if(!o||!o.a)return'#141b3d';if(o.a<3)return'#252d5e';var p=o.p/o.a;return p<.4?'#8f2d3a':p<.7?'#9a5a28':p<.9?'#85752a':p<1.1?'#4a8346':'#2a7a4c'}
function zoneSvg(shots){var Z={};shots.forEach(function(s){var k=zone(s.x,s.y,s.v),o=Z[k]||(Z[k]={a:0,m:0,p:0});o.a++;if(s.r){o.m++;o.p+=s.v}});
 var F=function(k){return zFill(Z[k])},in2='M90 0 V299 A675 675 0 0 0 1410 299 V0 Z',T='fill="none" stroke="#e8ecff" stroke-width="2.6" stroke-opacity=".55"',C='fill="none" stroke="#e8ecff" stroke-width="6"';
 var h='<svg class="court" viewBox="-30 -30 1560 1160" role="img" aria-label="Mappa a zone"><defs><clipPath id="zc2"><path d="'+in2+'"/></clipPath><clipPath id="zc3"><path clip-rule="evenodd" d="M0 0 H1500 V1100 H0 Z '+in2+'"/></clipPath></defs>'+
 '<g clip-path="url(#zc2)"><rect x="0" y="0" width="505" height="1100" fill="'+F('Media sx')+'"/><rect x="995" y="0" width="505" height="1100" fill="'+F('Media dx')+'"/><rect x="505" y="0" width="490" height="1100" fill="'+F('Media centro')+'"/><rect x="505" y="0" width="490" height="580" fill="'+F('Pitturato')+'"/><path d="M556 0 A250 250 0 1 0 944 0 Z" fill="'+F('Area')+'"/></g>'+
 '<g clip-path="url(#zc3)"><rect x="0" y="0" width="750" height="299" fill="'+F('Angolo sx')+'"/><rect x="750" y="0" width="750" height="299" fill="'+F('Angolo dx')+'"/><rect x="0" y="299" width="450" height="801" fill="'+F('Tripla ala sx')+'"/><rect x="450" y="299" width="600" height="801" fill="'+F('Tripla centro')+'"/><rect x="1050" y="299" width="450" height="801" fill="'+F('Tripla ala dx')+'"/></g>'+
 '<g '+T+'><path d="M556 0 A250 250 0 1 0 944 0"/><path d="M505 0 V786.5 M995 0 V786.5 M505 580 H995"/><path d="M0 299 H90 M1410 299 H1500"/><path d="M450 762 V1100 M1050 762 V1100"/></g>'+
 '<g '+C+'><rect x="0" y="0" width="1500" height="1400"/><rect x="505" y="0" width="490" height="580"/><path d="M570 580 A180 180 0 0 0 930 580"/><path d="M570 580 A180 180 0 0 1 930 580" stroke-dasharray="22 18" stroke-opacity=".5"/><path d="M625 120 V157.5 A125 125 0 0 0 875 157.5 V120"/><path d="M90 0 V299 A675 675 0 0 0 1410 299 V0"/><path d="M660 120 H840 M750 120 V135" stroke-width="10"/><circle cx="750" cy="157.5" r="22.5" stroke="#ffd93a"/></g>';
 var P={'Area':[750,330],'Pitturato':[750,505],'Media centro':[750,690],'Media sx':[300,370],'Media dx':[1200,370],'Angolo sx':[45,160],'Angolo dx':[1455,160],'Tripla ala sx':[225,760],'Tripla ala dx':[1275,760],'Tripla centro':[750,930]};
 Object.keys(P).forEach(function(k){var o=Z[k]||{a:0,m:0,p:0},sm=k.indexOf('Angolo')===0,f=sm?34:64,f2=sm?24:36,x=P[k][0],y=P[k][1],low=o.a<3;
  if(!o.a){h+='<text x="'+x+'" y="'+(y+10)+'" text-anchor="middle" font-size="'+(sm?30:46)+'" font-weight="800" fill="#4a5490">–</text>';return}
