<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Referto Basket – Accesso</title><meta name="theme-color" content="#0b1233">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head><body>
<div class="login" id="box"><div class="logo">🏀</div><h1>Referto Basket</h1><p>Inserisci il PIN dello staff</p>
<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><div class="err" id="err"></div>
<div class="pad" id="pad"></div></div>
<script src="app.js"></script>
<script>
if(isAuth())location.replace('home.html');
var v='',pad=document.getElementById('pad');
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(function(k){var b=document.createElement('button');b.textContent=k;if(!k)b.style.visibility='hidden';b.onclick=function(){tasto(k)};pad.appendChild(b)});
function draw(){[].forEach.call(document.querySelectorAll('#dots i'),function(d,i){d.className=i<v.length?'on':''})}
function tasto(k){document.getElementById('err').textContent='';
 if(k==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=k;draw();
 if(v.length===4){if(v===PIN_CORRETTO){login();location.replace('home.html')}else{
  var b=document.getElementById('box');b.classList.add('shake');document.getElementById('err').textContent='PIN errato';
  setTimeout(function(){b.classList.remove('shake');v='';draw()},350)}}}
addEventListener('keydown',function(e){if(/^\d$/.test(e.key))tasto(e.key);else if(e.key==='Backspace')tasto('⌫')});
</script></body></html>
